name: worker-size

# The Worker bundle size budget in .worker-size.json, checked by devkit's shared worker-size.yml against
# `wrangler deploy --dry-run` of the build (the build leaves .wrangler/deploy/config.json pointing the dry
# run at build/server/wrangler.json). No secret: the install copies wrangler.jsonc.example and a dry run
# never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@d9d5a3448a50f183c3c8b4a5f293717728717245 # v0.20.8
    with:
      # The version in package.json's engines field, as ci.yml reads it.
      node-version-file: package.json
      prepare: npm run build
