name: checks

# devkit's pull request checks in one job (pr.yml): the "Generated by Claude Code" footer removed from pull request
# descriptions, no AI trailer or author on new commits, the shared-code check, OSV-Scanner on what the change adds,
# actionlint and zizmor when .github/ changes, the Worker bundle size and the reviewer (advisory). Exceptions to the
# shared-code check are in .shared.json with their reasons, OSV-Scanner's in osv-scanner.toml, the workflow audit's in
# .github/actionlint.yaml and .github/zizmor.yml. What is shared: https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). The deploy and the
# checks it needs are in ci.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id makes the check "checks / Repo checks", the name main's ruleset requires.
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@ee6280c21537b30995f59474060ff3181896e15b # v0.41.0
    with:
      review: true
      # The version in package.json's engines field, as ci.yml reads it.
      node-version-file: package.json
      # ci.yml's bloat job runs devkit-no-bloat (npm run check:bloat, with the route weight), as the required check `bloat`.
      no-bloat: false
      # The build leaves .wrangler/deploy/config.json pointing the dry run at build/server/wrangler.json; the install
      # copies wrangler.jsonc.example, and a dry run never talks to the account.
      worker-size-prepare: npm run build
