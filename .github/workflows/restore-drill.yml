# The weekly restore drill (devkit's restore-drill.yml): the newest complete nightly dump in carrel-backups is restored into
# a scratch SQLite file and checked. The token reads the backups bucket only (R2: Read), so the drill changes nothing.
name: restore-drill

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@dd3d7dc3b0a50433c29a5b0af8148a8f2dd16989 # v0.20.0
    with:
      bucket: carrel-backups
      d1-dump-ref: v0.7.0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
