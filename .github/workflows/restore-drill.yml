# The weekly restore drill (devkit's restore-drill.yml): the newest complete nightly dump in carrel-backups is restored into
# a scratch SQLite file and checked. The token reads the backups bucket only (R2: Read), so the drill changes nothing.
name: restore-drill

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@250d737c13b6f4c74987652818d262cb1d1c9cf7 # v0.27.0
    with:
      bucket: carrel-backups
      # The same d1-dump release the nightly dump runs (package.json).
      d1-dump-ref: v0.16.0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
