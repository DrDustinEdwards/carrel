# The weekly restore drill (devkit's restore-drill.yml): the newest complete nightly dump in carrel-backups is restored into
# a scratch SQLite file and checked. The token reads the backups bucket only (R2: Read), so the drill changes nothing.
name: restore-drill

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@d44675809ea4be692d8c24225337386e257956b2 # v0.55.1
    with:
      bucket: carrel-backups
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
