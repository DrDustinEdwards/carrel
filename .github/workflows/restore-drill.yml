# The weekly restore drill (devkit's restore-drill.yml): the newest complete nightly dump in carrel-backups is restored into
# a scratch SQLite file and checked. The token reads the backups bucket only (R2: Read), so the drill changes nothing.
name: restore-drill

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@a0fbcb5c7f65e4183a97989511f9d352950ad90b # v0.20.7
    with:
      bucket: carrel-backups
      # d1-dump 0.7.0, untagged until Dustin tags it; move to v0.7.0 then.
      d1-dump-ref: 53758765ce374e42d98a6d11c0425601f397e6fd
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
