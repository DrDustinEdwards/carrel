# Carrel's checks, on every push and every pull request, and a deploy on a push to main after they
# pass. The check and gates jobs use no secrets: the tests run in workerd with a local D1 and never
# reach the network, and the gates start their own local Workers. Only the deploy job holds secrets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A push to main is never cancelled by the next one: cancelling a deploy halfway could leave the
# database migrated and the Worker not. Every other ref still cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version in package.json's engines field.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The formatted editor keeps the Markdown underneath byte for byte. The
      # site's own content is checked out read-only at test time, never committed here (this repo
      # holds no writing), and every file must come back from the editor unchanged.
      - name: Check out dustinedwards.info's content (public, read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: DrDustinEdwards/dustinedwards-info
          path: .roundtrip/dustinedwards-info
          sparse-checkout: content
          persist-credentials: false
      - run: npm run check:roundtrip -- .roundtrip/dustinedwards-info/content
      - run: npm run check:roundtrip -- test/fixtures/markdown --plain
      - run: npm run check:postinstall
      - run: npm run check:mcp-roles
      - name: Install Chromium for the accessibility scan
        run: npx playwright install --with-deps chromium
      - run: npm run check:a11y

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check:conformance
      # Each gate seen red on a planted violation (several minutes).
      - run: npm run check:plants

  # Warn-only: Knip, jscpd and the JS and CSS weight per route, compared with docs/bloat-baseline.json
  # and posted to the job summary. It always exits 0 and continue-on-error backs that up; nothing
  # waits on it. It runs beside check and gates, so it adds no wall-clock time to a pull request.
  bloat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check:bloat

  # THE DEPLOY, VERIFIED LIVE AND ROLLED BACK ON A REFUSAL: devkit's shared workflow (worker-deploy.yml),
  # pinned to the full sha of its v0.6.0 tag. Its `deploy` job runs Carrel's own guard first,
  # `scripts/deploy.mjs --prepare` (render the config, check the ids against the account, build, apply
  # the D1 migrations, confirm none is pending; any failure stops the run before the deploy), then
  # deploys the build with DEPLOY_SHA set to this commit. Its `live gate` job polls the AI door's /health,
  # the one Carrel host outside Access, until it names this commit, runs scripts/verify-live.mjs, and on a
  # refusal runs "Roll back the deploy this run shipped". A rollback swaps code and bindings only and
  # never undoes a D1 migration (devkit's README, "The shared deploy"). It never runs on a pull request or
  # on a branch other than main. test/deploy-workflow.test.ts pins the call; move the sha and the comment
  # together.
  deploy:
    needs: [check, gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@491b6cc552a80cdfcb4c0b5184e51682f907eda3 # v0.6.0
    with:
      worker-name: carrel
      health-url: https://carrel-mcp.dustinedwards.info/health
      verify-command: node scripts/verify-live.mjs
      # The version in package.json's engines field.
      node-version-file: package.json
      # The ids and the alert address are repository variables, not secrets: devkit's workflow takes only
      # the two Cloudflare secrets, and scripts/deploy.mjs checks each value before it uses it.
      pre-deploy: >-
        CARREL_D1_DATABASE_ID='${{ vars.CARREL_D1_DATABASE_ID }}'
        CARREL_KV_OAUTH_ID='${{ vars.CARREL_KV_OAUTH_ID }}'
        CARREL_ALERT_EMAIL='${{ vars.CARREL_ALERT_EMAIL }}'
        node scripts/deploy.mjs --prepare
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
