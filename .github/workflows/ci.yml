# Carrel's checks, on every pull request and every push to main, and a deploy on a push to main after the fast ones
# pass. The check and gates jobs use no secrets: the tests run in workerd with a local D1 and never reach the network,
# and the gates start their own local Workers. Only the deploy job holds secrets. The planted-failure proofs
# (check:plants) are in plants.yml: nightly, and on a pull request that touches what they prove.
name: CI

on:
  # A branch's run comes from its pull request; a push runs only on main, so no commit runs twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to main is never canceled by the next one: canceling a deploy halfway could leave the
# database migrated and the Worker not. Every other ref still cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version in package.json's engines field.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - run: npm test
      # The public site (www/) builds, so a Capsomer or Prelum bump cannot break it unseen.
      - run: npm run www
      # The formatted editor keeps the Markdown underneath byte for byte. The
      # site's own content is checked out read-only at test time, never committed here (this repo
      # holds no writing), and every file must come back from the editor unchanged.
      - name: Check out dustinedwards.info's content (public, read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: DrDustinEdwards/dustinedwards-info
          path: .roundtrip/dustinedwards-info
          sparse-checkout: content
          persist-credentials: false
      - run: npm run check:roundtrip -- .roundtrip/dustinedwards-info/content
      - run: npm run check:roundtrip -- test/fixtures/markdown --plain
      - run: npm run check:postinstall
      # Raw console.* calls in server code may not rise above .console.json's baseline (devkit-console), and every D1
      # migration is recorded in drizzle/manifest.json and, after it, expand only (devkit-migrations).
      - run: npm run check:console
      - run: npm run check:migrations
      - run: npm run check:mcp-roles
      # The MCP door against the protocol's conformance suite, on two local Workers (about 15 s).
      - run: npm run check:conformance

  # THE ACCESSIBILITY SCAN, check:a11y: axe on every Desk screen as the real app renders it, both themes, desktop and
  # phone, and any script error or hydration mismatch on the way. It is the browser check for flows that must never
  # break, so it runs on every pull request and push that can change a screen. It was the last step of `check` (about
  # 6 of its 10 minutes); in its own job, in the slot the planted-failure proofs used to hold, it runs beside `check`,
  # so a pull request takes about as long as the scan alone and the deploy no longer waits for it. The job count is
  # the same as before (check, gates and bloat), and the job keeps the name `gates` because main's ruleset requires a
  # check of that name.
  #
  # It skips the install and the scan (and passes, as the required check it is) only when every changed file is one
  # no screen reads: docs/, .claude/, www/ (the public site, its own Worker, built in `check`), a Markdown file or
  # LICENSE at the root, and .github/ other than this file. Anything else, a new directory included, runs it
  # (scripts/ci-scope.sh).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The commit and its parent, for the comparison below.
          fetch-depth: 2
      - name: Decide whether this change can reach a screen
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          SKIP: '^(docs/|\.claude/|www/|\.github/|[^/]+\.md$|LICENSE$)'
          KEEP: '^\.github/workflows/ci\.yml$'
        run: scripts/ci-scope.sh
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Install Chromium for the accessibility scan
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.run == 'true'
        run: npm run check:a11y

  # Knip and jscpd against .no-bloat.json (devkit-no-bloat): a count above its baseline fails. Then the weight per
  # route against .route-weight.json (devkit-route-weight), which fails over budget_bytes (area 7, D5). It runs beside check and gates, so it
  # adds no wall-clock time to a pull request.
  bloat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check:bloat

  # THE DEPLOY, VERIFIED LIVE AND ROLLED BACK ON A REFUSAL: devkit's shared workflow (worker-deploy.yml),
  # pinned to the full sha of its tag. Its `deploy` job runs Carrel's own guard first,
  # `scripts/deploy.mjs --prepare` (render the config, check the ids against the account, build, apply
  # the pending D1 migrations that only add with devkit-migrations --apply, which refuses a drop, rename or
  # row delete for a hand run and confirms none is pending; any failure stops the run before the deploy), then
  # deploys the build with DEPLOY_SHA set to this commit. Its `live gate` job polls the AI door's /health,
  # the one Carrel host outside Access, until it names this commit, runs scripts/verify-live.mjs, and on a
  # refusal runs "Roll back the deploy this run shipped". With `d1-database`, the job first reads D1's Time Travel bookmark
  # and writes it, with the restore command, to its summary, so a bad migration is one restore to undo. A rollback swaps code and bindings only and
  # never undoes a D1 migration (devkit's README, "The shared deploy"). It never runs on a pull request or
  # on a branch other than main.
  #
  # It waits for `check` only: the typecheck, the tests (every D1 migration applied in workerd), the migrations check
  # (expand only), the AI roles and the MCP conformance suite, run on this merge commit, which can differ from the
  # pull request's head because the ruleset does not require a branch to be up to date. The accessibility scan
  # (`gates`) runs on the same commit beside the deploy, and the planted-failure proofs nightly (plants.yml). Neither
  # tests a migration or the deploy, and the pull request already ran both on its own merge commit, so waiting for
  # them only bought the case where two pull requests merged close together break a screen between them. Then main
  # goes red with the scan's failure, in GitHub's mail, and the fix is one rollback. The deploy starts about
  # 7 minutes sooner.
  deploy:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@250d737c13b6f4c74987652818d262cb1d1c9cf7 # v0.27.0
    with:
      worker-name: carrel-desk
      # site-runtime withAdminIdle's key and audit-log's signing key (0.85), minted once by the deploy and never shown (devkit "generated-secrets").
      generated-secrets: ADMIN_IDLE_SECRET AUDIT_SIGNING_KEY
      d1-database: carrel
      health-url: https://carrel-mcp.dustinedwards.info/health
      verify-command: node scripts/verify-live.mjs
      # The version in package.json's engines field.
      node-version-file: package.json
      # The ids and the alert address are repository variables, not secrets: devkit's workflow takes only
      # the two Cloudflare secrets, and scripts/deploy.mjs checks each value before it uses it.
      pre-deploy: >-
        CARREL_D1_DATABASE_ID='${{ vars.CARREL_D1_DATABASE_ID }}'
        CARREL_KV_OAUTH_ID='${{ vars.CARREL_KV_OAUTH_ID }}'
        CARREL_ALERT_EMAIL='${{ vars.CARREL_ALERT_EMAIL }}'
        node scripts/deploy.mjs --prepare
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # THE PUBLIC SITE (www/, the carrel Worker at https://carrel.dustinedwards.info), through the same shared workflow: once
  # the checks pass it builds www/dist, deploys with DEPLOY_SHA set to this commit, waits for www's /health
  # (site-runtime's staticSite) to report it, checks the home page answers, and rolls the deploy back if it does not.
  # It runs in www/, so wrangler reads www/wrangler.jsonc; the install and the build run from the repository root.
  # Like the Desk's deploy, it waits for `check` only, which builds www/ (npm run www); the scan never looks at www/.
  deploy-www:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@250d737c13b6f4c74987652818d262cb1d1c9cf7 # v0.27.0
    with:
      worker-name: carrel
      health-url: https://carrel.dustinedwards.info/health
      verify-command: node "$DEVKIT_DIR/bin/verify-deploy.mjs" https://carrel.dustinedwards.info
      node-version-file: package.json
      working-directory: www
      install: cd .. && npm ci
      pre-deploy: cd .. && npm run www
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Prelum's prelum-indexnow with the live sitemap and the key in www/build.mjs, once the public site's live gate passes.
  # A refused ping is a warning, never a failed deploy.
  indexnow:
    needs: deploy-www
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Tell IndexNow
        run: |
          key=$(sed -n 's/^const INDEXNOW_KEY = "\(.*\)";$/\1/p' www/build.mjs)
          curl -sf https://carrel.dustinedwards.info/sitemap.xml -o "$RUNNER_TEMP/sitemap.xml"
          npx prelum-indexnow --origin https://carrel.dustinedwards.info --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
