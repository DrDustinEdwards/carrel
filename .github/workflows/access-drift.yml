name: access-drift

# The daily Access drift check (devkit's access-drift.yml, area 3 I2): who carrel-desk-login lets in, against the Desk's
# active people, read hashed from /admin/access-drift.
# It fails until ACCESS_READ_TOKEN, CLOUDFLARE_ACCOUNT_ID, ACCESS_CLIENT_ID and ACCESS_CLIENT_SECRET are set, by design.

on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: DrDustinEdwards/devkit/.github/workflows/access-drift.yml@e7ecda8f69c8bbde738edcd1cf510710e547bcf3 # v0.20.22
    with:
      app: carrel-desk-login
      admins-url: https://desk.dustinedwards.info/admin/access-drift
      site-runtime-ref: v0.59.0
    secrets:
      ACCESS_READ_TOKEN: ${{ secrets.ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
