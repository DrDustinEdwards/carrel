# Deploys Carrel's public site (www/, the carrel-www Worker) to https://carrel.dustinedwards.info. It runs by hand, and on a
# push to main that touches www/ once the repository variable CARREL_WWW_LIVE is "true", which Dustin sets after the
# cutover in docs/public-site.md: until then carrel.dustinedwards.info belongs to the app, and this deploy would fail.
name: Deploy public site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", "package-lock.json"]

permissions:
  contents: read

concurrency:
  group: www-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CARREL_WWW_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run deploy:www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
