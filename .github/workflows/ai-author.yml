name: ai-author

# Refuses an AI attribution trailer on a commit a push or pull request adds, and a commit authored or
# committed as Claude. The workflow is devkit's, pinned to the full sha of its v0.6.0 tag (491b6cc);
# the check runs the devkit-check-trailers bin from the same tag in package.json. Move both together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@491b6cc552a80cdfcb4c0b5184e51682f907eda3 # v0.6.0
