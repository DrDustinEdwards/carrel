name: ai-author

# Refuses an AI attribution trailer on a commit a push or pull request adds, and a commit authored or
# committed as Claude. The workflow is devkit's, pinned to the full sha of its v0.9.0 tag (6f4c67e);
# the check runs the devkit-check-trailers bin from the same tag in package.json. Move both together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ai-author-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@005509b56d9830b785f17ba496f4a3c223fc392c # v0.20.19
