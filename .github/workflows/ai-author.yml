name: ai-author

# Refuses an AI attribution trailer on a commit a push or pull request adds, and a commit authored or
# committed as Claude. The workflow is devkit's, pinned to the full sha of its v0.9.0 tag (6f4c67e);
# the check runs the devkit-check-trailers bin from the same tag in package.json. Move both together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@426522e707da5d0ea9ac620b5ef6d24229267570 # v0.13.2
