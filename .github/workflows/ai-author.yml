name: ai-author

# Refuses an AI attribution trailer on a commit a push or pull request adds, and a commit authored or
# committed as Claude. The workflow is devkit's, pinned to the full sha of its v0.7.0 tag (27e0a1c);
# the check runs the devkit-check-trailers bin from the same tag in package.json. Move both together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@d92c2d87a1d14fa059cd256fa6b011fde8666f96 # v0.8.0
